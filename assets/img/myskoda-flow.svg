<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="OAuth custom scheme flow">
  <rect width="860" height="300" fill="#0b0d10" rx="18"/>
  <rect x="24" y="28" width="190" height="90" rx="12" fill="#111827" stroke="#34d399"/>
  <text x="40" y="58" fill="#34d399" font-family="IBM Plex Mono,monospace" font-size="13">1 LOGIN</text>
  <text x="40" y="86" fill="#9ca3af" font-family="Sora,sans-serif" font-size="13">genuine IdP page</text>
  <rect x="232" y="28" width="190" height="90" rx="12" fill="#111827" stroke="#fbbf24"/>
  <text x="248" y="58" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="13">2 REDIRECT</text>
  <text x="248" y="86" fill="#9ca3af" font-family="Sora,sans-serif" font-size="13">myskoda:// callback</text>
  <rect x="440" y="28" width="190" height="90" rx="12" fill="#111827" stroke="#fb7185"/>
  <text x="456" y="58" fill="#fb7185" font-family="IBM Plex Mono,monospace" font-size="13">3 CHOOSER</text>
  <text x="456" y="86" fill="#9ca3af" font-family="Sora,sans-serif" font-size="13">any app can claim it</text>
  <rect x="648" y="28" width="188" height="90" rx="12" fill="#111827" stroke="#60a5fa"/>
  <text x="664" y="58" fill="#60a5fa" font-family="IBM Plex Mono,monospace" font-size="13">4 CODE</text>
  <text x="664" y="86" fill="#9ca3af" font-family="Sora,sans-serif" font-size="13">JWT code leaves app</text>
  <text x="24" y="168" fill="#34d399" font-family="IBM Plex Mono,monospace" font-size="12">TEST</text>
  <text x="90" y="168" fill="#9ca3af" font-family="Sora,sans-serif" font-size="14">Intent.getData hook · own account · non-rooted device</text>
  <text x="24" y="202" fill="#fbbf24" font-family="IBM Plex Mono,monospace" font-size="12">PROOF</text>
  <text x="90" y="202" fill="#9ca3af" font-family="Sora,sans-serif" font-size="14">12 KB lab app, no permissions, same scheme, chooser hands it the code</text>
  <text x="24" y="236" fill="#fb7185" font-family="IBM Plex Mono,monospace" font-size="12">GAP</text>
  <text x="90" y="236" fill="#9ca3af" font-family="Sora,sans-serif" font-size="14">PKCE binds who started the request, not who receives the redirect</text>
  <text x="24" y="270" fill="#6b7280" font-family="IBM Plex Mono,monospace" font-size="12">fix · verified https App Link · retire the custom scheme</text>
</svg>
